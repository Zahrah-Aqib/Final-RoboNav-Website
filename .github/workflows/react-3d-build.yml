name: RoboNav 3D standalone React
on:
  push:
    branches: [main]
    paths:
      - 'robonav-3d-react/**'
      - '.github/workflows/react-3d-build.yml'
  pull_request:
    paths:
      - 'robonav-3d-react/**'
      - '.github/workflows/react-3d-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robonav-3d-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: robonav-3d-react/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck React/TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Build standalone Vite application
        run: npm run build
